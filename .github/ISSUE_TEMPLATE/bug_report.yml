name: Bug report
description: Something is broken or does not behave as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome on macOS, Safari on iPhone, ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console errors or screenshots
      description: Remove secrets before posting.
    validations:
      required: false
